services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: document_ingestion
      POSTGRES_USER: document_ingestion
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_ingestion -d document_ingestion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
